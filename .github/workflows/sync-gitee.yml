name: Sync existing release to Gitee
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag (no APK rebuild or tag changes)'
        required: true
        default: 'v1.0.97'
permissions:
  contents: read
concurrency:
  group: gitee-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify existing GitHub APK and archived notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          tag = os.environ['TAG']
          assert re.fullmatch(r'v1\.0\.\d+', tag)
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/{tag}']))
          assert not release['draft'] and not release['prerelease']
          asset = next(a for a in release['assets'] if a['name'] == 'app-release.apk')
          subprocess.run(['gh','release','download',tag,'--repo',repo,'--pattern','app-release.apk','--dir','apk'],check=True)
          apk = pathlib.Path('apk/app-release.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert asset['size'] == apk.stat().st_size and asset['digest'] == 'sha256:' + digest
          source = subprocess.check_output(['git','show',f'{tag}:release-notes/{tag}.md'],text=True)
          section = source.split('## notes\n',1)[1].split('\n## ',1)[0]
          notes = '\n'.join(line for line in section.splitlines() if line.strip())
          assert notes
          pathlib.Path('release-notes.txt').write_text(notes)
          print('Verified existing release APK SHA-256:', digest)
          PY
      - name: Check synchronization policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_sync_gitee_release.py'
      - name: Synchronize and verify Gitee APK before metadata
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/sync_gitee_release.py --tag "$TAG" --apk apk/app-release.apk --notes-file release-notes.txt
      - name: Verify delivery and publish archived announcement
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          os.environ['RELEASE_NOTES'] = pathlib.Path('release-notes.txt').read_text()
          subprocess.run(['python3','scripts/publish_announcement.py','--tag',os.environ['TAG']],check=True)
          PY
