name: Android Test Build
run-name: Android test · ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '测试版本号；不创建正式 tag 或 Release'
        required: true
        default: 'v1.0.98'
      deploy_test_mirror:
        description: '同步免费测试镜像并做三轮上传及完整下载校验'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Validate release scripts and select test version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/prepare_test_release.py
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
      - name: Test and build signed APK
        env:
          RELEASE_SIGNING_CONFIG_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleRelease --no-parallel --max-workers=2 --console=plain
      - name: Bind artifact to source and check reports
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release.apk delivery/app-release.apk
          cp release-notes.txt delivery/release-notes.txt
          python3 scripts/release_distribution.py receipt --apk delivery/app-release.apk --tests app/build/test-results/testDebugUnitTest --source "$SOURCE_SHA" --build-id "$BUILD_ID" --output delivery/receipt.json
      - name: Upload signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: delivery/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f app/release-key.jks
      - name: Summarize test build
        run: |
          echo 'Signed test APK ready. Main, formal tags, stable metadata and Gitee are unchanged.' >> "$GITHUB_STEP_SUMMARY"
  test-mirror:
    if: inputs.deploy_test_mirror
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: app-updates-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: distribution/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: delivery
      - name: Install fixed deployment CLI
        working-directory: distribution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify three uploads and publish test manifest
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: python3 scripts/release_distribution.py deploy --apk delivery/app-release.apk --receipt delivery/receipt.json --channel test --notes delivery/release-notes.txt --rounds 3 --output delivery/test-mirror.json
      - name: Summarize individual delivery targets
        if: always()
        run: python3 scripts/delivery_summary.py delivery/test-mirror.json
      - name: Upload mirror evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-mirror-report
          path: |
            delivery/test-mirror.json
            delivery/test-mirror.json.timings.json
          retention-days: 7
      - name: Summarize mirror state
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Test mirror: $RESULT. https://dl-test.hidisiwa.xyz" >> "$GITHUB_STEP_SUMMARY"
          echo 'A mirror failure can be retried as this job only; do not rebuild the APK.' >> "$GITHUB_STEP_SUMMARY"
