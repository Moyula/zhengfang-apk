name: Isolated plugin audit
run-name: Plugin audit · ${{ inputs.self_test == 'true' && 'toolchain self-test' || inputs.draft_id }}
on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: 'Opaque Cloudflare audit task ID'
        required: false
      nonce:
        description: 'Task generation; contains no source or account data'
        required: false
      self_test:
        description: 'Run public synthetic toolchain checks only'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: plugin-audit-${{ inputs.draft_id }}-${{ inputs.nonce }}-${{ inputs.self_test }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable isolated unprivileged execution on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run assigned audit or public self-test
        env:
          AUDIT_QUEUE_TOKEN: ${{ secrets.AUDIT_QUEUE_TOKEN }}
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          AUDIT_DRAFT_ID: ${{ inputs.draft_id }}
          AUDIT_NONCE: ${{ inputs.nonce }}
          AUDIT_SELF_TEST: ${{ inputs.self_test }}
        run: python3 scripts/plugin_audit_job.py
      - name: Record startup failure without exposing submitted source
        if: failure() && inputs.self_test != 'true'
        env:
          AUDIT_QUEUE_TOKEN: ${{ secrets.AUDIT_QUEUE_TOKEN }}
          AUDIT_DRAFT_ID: ${{ inputs.draft_id }}
          AUDIT_NONCE: ${{ inputs.nonce }}
        run: python3 scripts/plugin_audit_job.py --failure
